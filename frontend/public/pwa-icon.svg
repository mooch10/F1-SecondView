<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#080A0E" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1801" />
      <stop offset="100%" stop-color="#B30000" />
    </linearGradient>
    <linearGradient id="cyanStreak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27F4D2" />
      <stop offset="100%" stop-color="#00AEEF" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#222836" stroke-width="8" />

  <!-- Speed Streaks (Delta Aerodynamic Airflow) -->
  <path d="M70 380 L180 130 L225 130 L115 380 Z" fill="url(#cyanStreak)" opacity="0.85" />
  <path d="M150 380 L260 130 L305 130 L195 380 Z" fill="url(#redGlow)" />

  <!-- Stylized "D" Monogram -->
  <g transform="translate(195, 140) skewX(-16)" fill="#FFFFFF">
    <rect x="30" y="0" width="38" height="230" rx="6" />
    <path d="M68 0 H130 C185 0 215 45 215 115 C215 185 185 230 130 230 H68 Z M98 38 V192 H125 C160 192 178 165 178 115 C178 65 160 38 125 38 Z" />
  </g>

  <!-- DRS Pulse Dot -->
  <circle cx="410" cy="120" r="16" fill="#27F4D2" />
  <circle cx="410" cy="120" r="28" stroke="#27F4D2" stroke-width="4" fill="none" opacity="0.4" />
</svg>
